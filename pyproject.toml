[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adr-gateway"
version = "0.1.0"
description = "Lightweight ADR-compatible HTTP adapter"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["adr_gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
